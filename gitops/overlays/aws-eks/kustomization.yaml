apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: sri-facturacion-aws-eks

namespace: sri-facturacion

resources:
- ../../bases
- ingress.yaml
- secrets-store-ssm.yaml
- serviceaccount.yaml

patches:
- path: configmap-patch.yaml
  target:
    kind: ConfigMap
    name: sri-facturacion-config
- path: backend-secrets-patch.yaml
  target:
    kind: Deployment
    name: sri-backend
- path: frontend-secrets-patch.yaml
  target:
    kind: Deployment
    name: sri-frontend
- path: hpa-patch.yaml
  target:
     kind: HorizontalPodAutoscaler
     name: sri-backend-hpa

images:
- name: sri-backend
  newName: 053044806920.dkr.ecr.us-east-1.amazonaws.com/sri-backend
  newTag: latest
- name: sri-frontend
  newName: 053044806920.dkr.ecr.us-east-1.amazonaws.com/sri-frontend
  newTag: latest

commonLabels:
  cloud: aws-eks
