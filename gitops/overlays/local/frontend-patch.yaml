apiVersion: apps/v1
kind: Deployment
metadata:
  name: sri-frontend
spec:
  replicas: 2
  template:
    spec:
      containers:
      - name: sri-frontend
        image: sri-frontend:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: sri-facturacion-config
        - secretRef:
            name: sri-facturacion-secrets
