apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sri-facturacion-azure-secrets
  labels:
    app: sri-facturacion-service
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "<MANAGED_IDENTITY_CLIENT_ID>"
    keyvaultName: "sri-keyvault"
    tenantId: "<AZURE_TENANT_ID>"
    objects: |
      array:
        - |
          objectName: supabase-key
          objectType: secret
          objectAlias: SUPABASE_KEY
        - |
          objectName: jwt-secret
          objectType: secret
          objectAlias: JWT_SECRET
        - |
          objectName: flask-secret-key
          objectType: secret
          objectAlias: FLASK_SECRET_KEY
  secretObjects:
    - secretName: sri-facturacion-secrets
      type: Opaque
      data:
        - objectName: SUPABASE_KEY
          key: SUPABASE_KEY
        - objectName: JWT_SECRET
          key: JWT_SECRET
        - objectName: FLASK_SECRET_KEY
          key: FLASK_SECRET_KEY
