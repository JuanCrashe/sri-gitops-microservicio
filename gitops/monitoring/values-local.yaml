# ============================================
# Valores para kube-prometheus-stack (Entorno Local Docker Desktop)
# Observabilidad optimizada para bajo consumo de recursos y disco
# ============================================

fullnameOverride: sri-monitoring

# ----- Prometheus -----
prometheus:
  prometheusSpec:
    # Retención corta (2 días) para proteger el disco local
    retention: 2d
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # Descubrimiento amplio de ServiceMonitors / PodMonitors
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # Almacenamiento persistente ligero usando la StorageClass local por defecto
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    # Scrape dinámico para pods anotados con prometheus.io/scrape=true (ej. sri-backend)
    additionalScrapeConfigs:
      - job_name: 'sri-backend'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - sri-facturacion
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

# ----- Grafana -----
grafana:
  enabled: true
  defaultDashboardsEnabled: true
  adminPassword: prom-operator
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # Exponer directamente en http://localhost:3000 vía LoadBalancer de Docker Desktop
  service:
    type: LoadBalancer
    port: 3000
    targetPort: 3000
  # Persistencia deshabilitada en Grafana para evitar saturación de disco
  persistence:
    enabled: false

# ----- Alertmanager (Deshabilitado en local para ahorrar memoria y almacenamiento) -----
alertmanager:
  enabled: false

# ----- Métricas de Control Plane (deshabilitadas en Docker Desktop al no exponer endpoints estándares) -----
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false

# ----- Exporters del nodo y estado de Kubernetes -----
nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true
